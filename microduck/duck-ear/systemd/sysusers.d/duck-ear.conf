# Creates the `duck-ear` user and group.
#
# Install to /usr/lib/sysusers.d/duck-ear.conf; systemd-sysusers creates it at boot, or
# run `systemd-sysusers` once by hand. The unit fails to start without it.
#
# No home directory and no shell: this process listens and sends intents. Its read access
# is the model directory under /var/lib/robot; its write access is nothing at all.
u duck-ear - "Voice command listener" - -
