# Bridge the socket path `mediad` was compiled with to the one this replica's robotd uses.
#
# `/run/robotd.sock` is baked into `duck_ipc_proto::socket::ROBOT` and `mediad` has no
# `--socket` flag to override it, the way `robotctl` does. The replica runtime keeps its sockets
# under `local/` instead, so this symlink is the whole gap: mediad opens the path it knows, the
# kernel resolves it to robotd's real socket.
#
# Install as /etc/tmpfiles.d/robotd-socket.conf (root), then:
#
#   sudo systemd-tmpfiles --create /etc/tmpfiles.d/robotd-socket.conf
#
# Nothing needs restarting for the link to appear. It is created at boot too; if robotd has not
# started yet the dangling link is harmless, because a connection is only attempted against it
# later.
L /run/robotd.sock - - - - /home/duck/workspace/microduck-hd1910m/local/robotd.sock
